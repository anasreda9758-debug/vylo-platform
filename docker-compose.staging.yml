# Explicit staging only. No default migration or seeding on startup.
# Owner prepares DNS, secrets, approved schema/dataset and content first.
# See STAGING_ACCESS.md. Existing project/database volume identities retained.
name: lms-platform-staging

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a separate staging password}
      POSTGRES_DB: lms
      PGDATA: /var/lib/postgresql/data
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms -d lms"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    expose: ["3000"]
    command: ["sh", "-c", "node scripts/validate-staging-env.mjs && exec node server.js"]
    environment:
      NODE_ENV: production
      VYLO_ENVIRONMENT: staging
      STAGING_DOMAIN: ${STAGING_DOMAIN:?set a dedicated staging DNS name}
      DATABASE_URL: ${DATABASE_URL:?set the separate staging database URL}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a separate staging password}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set a separate staging auth secret}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set the exact HTTPS staging origin}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_URL:?}
      USE_HOSTED_AI: ${USE_HOSTED_AI:-false}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      STORAGE_DRIVER: local
      CONTENT_ROOT: /data
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ${STAGING_CONTENT_ROOT:?set the approved staging content directory}:/data:ro
    networks: [database, web]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O - http://127.0.0.1:3000/api/health | grep -q '"ok":true' || exit 1
      interval: 10s
      timeout: 5s
      retries: 12

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      STAGING_DOMAIN: ${STAGING_DOMAIN:?}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/staging/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web]
    depends_on:
      app:
        condition: service_healthy

  backup:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - backups:/backups
    networks: [database]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          pg_dump -h db -U lms -d lms -Fc -f /backups/lms-$$(date +%Y%m%d-%H%M%S).dump
          sleep 86400
        done
    depends_on:
      db:
        condition: service_healthy

networks:
  database:
    internal: true
  web:

volumes:
  pgdata:
  backups:
  caddy_data:
  caddy_config:
