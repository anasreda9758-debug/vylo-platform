<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#16233b"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#34d399"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  </defs>
  <rect width="1200" height="630" rx="36" fill="url(#bg)"/>
  <rect width="1200" height="630" rx="36" fill="none" stroke="#34d399" stroke-opacity=".35" stroke-width="2"/>
  <rect x="0" y="0" width="1200" height="10" rx="5" fill="url(#accent)"/>
  <text x="70" y="88" font-family="Arial, sans-serif" font-size="25" fill="#6ee7b7" font-weight="700">IBL-204  ·  PHYSIOLOGY</text>
  <text x="70" y="160" font-family="Arial, sans-serif" font-size="50" fill="#fff" font-weight="800">Blood indices</text>
  <text x="70" y="204" font-family="Arial, sans-serif" font-size="25" fill="#cbd5e1">A compact framework for classifying anaemia</text>
  <g font-family="Arial, sans-serif">
    <rect x="70" y="250" width="500" height="260" rx="22" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".14"/>
    <text x="105" y="302" font-size="28" fill="#6ee7b7" font-weight="700">Red-cell measurements</text>
    <text x="105" y="350" font-size="25" fill="#f8fafc" font-weight="700">RBC count</text><text x="300" y="350" font-size="24" fill="#cbd5e1">M 5–5.5 · F 4.5–5 million/mm³</text>
    <text x="105" y="400" font-size="25" fill="#f8fafc" font-weight="700">Haemoglobin</text><text x="300" y="400" font-size="24" fill="#cbd5e1">M avg 16 · F avg 14 g%</text>
    <text x="105" y="450" font-size="25" fill="#f8fafc" font-weight="700">Haematocrit</text><text x="300" y="450" font-size="24" fill="#cbd5e1">M 46% · F 42%</text>
    <rect x="630" y="250" width="500" height="260" rx="22" fill="#34d399" fill-opacity=".08" stroke="#34d399" stroke-opacity=".3"/>
    <text x="665" y="302" font-size="28" fill="#6ee7b7" font-weight="700">Indices that guide the diagnosis</text>
    <text x="665" y="352" font-size="26" fill="#fff" font-weight="700">MCV</text><text x="805" y="352" font-size="24" fill="#cbd5e1">83–97 µm³  ·  cell size</text>
    <text x="665" y="402" font-size="26" fill="#fff" font-weight="700">MCH</text><text x="805" y="402" font-size="24" fill="#cbd5e1">27–33 pg  ·  Hb/cell</text>
    <text x="665" y="452" font-size="26" fill="#fff" font-weight="700">MCHC</text><text x="805" y="452" font-size="24" fill="#cbd5e1">31–35%  ·  Hb concentration</text>
  </g>
  <text x="70" y="570" font-family="Arial, sans-serif" font-size="23" fill="#94a3b8">Low MCV/MCH → microcytic anaemia  ·  High values → macrocytic anaemia</text>
  <text x="1130" y="590" text-anchor="end" font-family="Arial, sans-serif" font-size="20" fill="#64748b">VYLO · verified lecture source</text>
</svg>
